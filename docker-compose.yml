version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orchestrateui-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    restart: unless-stopped
    networks:
      - orchestrateui-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: orchestrateui-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - orchestrateui-network

networks:
  orchestrateui-network:
    driver: bridge
